name: Production Node Runtime Audit (Read Only)

# The compatibility bit is computed inside the real running Node process.
# Avoid relying on the SSH user's PATH or /proc access to another service user.
on:
  workflow_run:
    workflows:
      - KLASSIO Production Deploy
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-node-runtime:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the running server's minimum Node requirement
        shell: bash
        env:
          EXPECTED_SHA: ${{
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha ||
            ''
          }}
        run: |
          set -euo pipefail
          release="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' \
            https://klassio.at/api/release)"
          # Do not display full release metadata or any environment values.
          jq -e '.commit | test("^[a-f0-9]{40}$")' <<< "$release" >/dev/null
          if [[ -n "$EXPECTED_SHA" ]]; then
            jq -e --arg sha "$EXPECTED_SHA" '.commit == $sha' <<< "$release" >/dev/null || {
              echo "Cannot audit runtime: deployed release differs from triggering commit"
              exit 1
            }
          fi
          compatible="$(jq -r '.runtime.node20OrNewer // "unknown"' <<< "$release")"
          case "$compatible" in
            true)
              echo "Confirmed by KLASSIO's running Node process: Node.js >=20"
              echo "Nodemailer 10 minimum runtime requirement: PASS"
              ;;
            false)
              echo "Confirmed by KLASSIO's running Node process: Node.js <20"
              echo "Nodemailer 10 minimum runtime requirement: BLOCKED"
              exit 2
              ;;
            *)
              echo "Node.js compatibility flag not present: runtime UNVERIFIED"
              exit 3
              ;;
          esac
