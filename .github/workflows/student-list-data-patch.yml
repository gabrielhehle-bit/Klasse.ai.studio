name: Apply Student List Data Patch

on:
  push:
    branches:
      - fix/student-list-data-consistency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-list-data-consistency
          fetch-depth: 0
      - name: Patch StudentList safely
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/StudentList.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { InteractionModal } from './InteractionModal';\n",
              "import { InteractionModal } from './InteractionModal';\nimport { getStudentComparableName, parseStudentBirthday, toDateInputValue } from '../lib/studentListData';\n",
              'helper import'
          )

          replace_once(
              '''const isBirthdayToday = (geburtstagStr: string | undefined | null) => {\n  if (!geburtstagStr) return false;\n  try {\n    const today = new Date();\n    let bday: Date;\n    const parts = geburtstagStr.split(".");\n    if (parts.length === 3) {\n      bday = new Date(today.getFullYear(), parseInt(parts[1]) - 1, parseInt(parts[0]));\n    } else {\n      bday = new Date(geburtstagStr);\n    }\n    return bday.getDate() === today.getDate() && bday.getMonth() === today.getMonth();\n  } catch (e) {\n    return false;\n  }\n};''',
              '''const isBirthdayToday = (geburtstagStr: string | undefined | null) => {\n  const bday = parseStudentBirthday(geburtstagStr);\n  if (!bday) return false;\n  const today = new Date();\n  return bday.getDate() === today.getDate() && bday.getMonth() === today.getMonth();\n};''',
              'birthday today helper'
          )

          replace_once(
              "return schueler.some(s => s.id !== editingStudent.id && s.name.toLowerCase() === currentFullName);",
              "return schueler.some(s => s.id !== editingStudent.id && getStudentComparableName(s) === currentFullName);",
              'duplicate-name fallback'
          )

          replace_once(
              '''      if (!s.geburtstag) return null;\n      let bday: Date;\n      const parts = s.geburtstag.split(".");\n      if (parts.length === 3) {\n        bday = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));\n      } else {\n        bday = new Date(s.geburtstag);\n      }\n      if (isNaN(bday.getTime())) return null;''',
              '''      const bday = parseStudentBirthday(s.geburtstag);\n      if (!bday) return null;''',
              'age summary parser'
          )

          replace_once(
              '''          const dateA = a.geburtstag ? new Date(a.geburtstag).getTime() : 0;\n          const dateB = b.geburtstag ? new Date(b.geburtstag).getTime() : 0;''',
              '''          const dateA = parseStudentBirthday(a.geburtstag)?.getTime() ?? 0;\n          const dateB = parseStudentBirthday(b.geburtstag)?.getTime() ?? 0;''',
              'age sorting parser'
          )

          replace_once(
              "                         value={editingStudent?.geburtstag || ''}\n",
              "                         value={toDateInputValue(editingStudent?.geburtstag)}\n",
              'legacy date input'
          )

          path.write_text(text)
          PY
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StudentList.tsx
          git diff --cached --check
          git commit -m "fix(students): handle legacy birthdays and names [skip ci]"
          git push origin HEAD:fix/student-list-data-consistency
