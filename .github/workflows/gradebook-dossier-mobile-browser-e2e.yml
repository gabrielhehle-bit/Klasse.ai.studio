name: Gradebook & Dossier Mobile Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gradebook-dossier-mobile-browser-e2e.yml'
      - 'scripts/gradebook-dossier-mobile-browser-e2e.mjs'
      - 'src/components/Gradebook.tsx'
      - 'src/components/StudentDossier.tsx'
      - 'src/components/dossier/DossierAssessmentChart.tsx'
      - 'src/components/dossier/DossierLeistungen.tsx'
      - 'src/components/dossier/DossierUebersicht.tsx'
      - 'src/lib/dossierMobileChartsRequirements.test.ts'
      - 'src/lib/dossierAssessmentChart.test.ts'
      - 'src/lib/dossierOverviewStats.test.ts'
      - 'src/index.css'
      - 'src/lib/gradebookScrollingUx.test.ts'
      - 'src/lib/dossierOverviewCompactRequirements.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gradebook-dossier-mobile-browser-e2e.yml'
      - 'scripts/gradebook-dossier-mobile-browser-e2e.mjs'
      - 'src/components/Gradebook.tsx'
      - 'src/components/StudentDossier.tsx'
      - 'src/components/dossier/DossierAssessmentChart.tsx'
      - 'src/components/dossier/DossierLeistungen.tsx'
      - 'src/components/dossier/DossierUebersicht.tsx'
      - 'src/lib/dossierMobileChartsRequirements.test.ts'
      - 'src/lib/dossierAssessmentChart.test.ts'
      - 'src/lib/dossierOverviewStats.test.ts'
      - 'src/index.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run focused mobile regression tests
        run: bun test src/lib/gradebookScrollingUx.test.ts src/lib/dossierOverviewCompactRequirements.test.ts src/lib/dossierAssessmentChart.test.ts src/lib/dossierOverviewStats.test.ts src/lib/dossierMobileChartsRequirements.test.ts
      - name: Production build
        run: bun run build
      - name: Verify 390px coarse-pointer UI in real Chrome
        env:
          NODE_ENV: production
          PORT: 3100
          APP_URL: http://localhost:3100
          SESSION_SECRET: ci-mobile-ui-session-secret-more-than-32-characters
          LEHRERAPP_ACCESS_TEAM: ci-mobile-audit-access-2026
          LEHRERAPP_ACCESS_EXTERNAL: ci-mobile-audit-external-2026
          KLASSIO_DATA_DIR: /tmp/klassio-mobile-ui-data
          KLASSIO_E2E_BASE_URL: http://localhost:3100/login
          KLASSIO_CHROME_DEBUG_URL: http://127.0.0.1:9282
          KLASSIO_E2E_ACCESS_CODE: ci-mobile-audit-access-2026
        run: |
          set -euo pipefail
          rm -rf /tmp/klassio-mobile-ui-data /tmp/klassio-mobile-ui-chrome
          mkdir -p /tmp/klassio-mobile-ui-data
          node dist/server.cjs > /tmp/klassio-mobile-ui-server.log 2>&1 &
          SERVER_PID=$!
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "Chrome binary not found"; exit 1; fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9282 --remote-allow-origins=* \
            --user-data-dir=/tmp/klassio-mobile-ui-chrome about:blank \
            > /tmp/klassio-mobile-ui-chrome.log 2>&1 &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3100/api/health > /tmp/klassio-mobile-ui-health.json; then break; fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/klassio-mobile-ui-health.json
          bun scripts/gradebook-dossier-mobile-browser-e2e.mjs
      - name: Upload diagnostic logs (demo-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassio-mobile-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/klassio-mobile-ui-server.log
            /tmp/klassio-mobile-ui-chrome.log
          if-no-files-found: ignore
          retention-days: 7
