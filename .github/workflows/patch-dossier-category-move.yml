name: Temporary Dossier Category Move Patch

on:
  push:
    branches:
      - fix/dossier-assessment-category-move
    paths:
      - .github/workflows/patch-dossier-category-move.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dossier-assessment-category-move
      - name: Patch dossier edit origin tracking
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/dossier/DossierLeistungen.tsx')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Expected snippet not found:\n{old}')
              text = text.replace(old, new, 1)

          replace_once(
              "    category: 'sa' | 'lzk' | 'wp' | 'aufgaben';\n    colIndex: number;\n    label: string;",
              "    category: 'sa' | 'lzk' | 'wp' | 'aufgaben';\n    colIndex: number;\n    originalCategory?: 'sa' | 'lzk' | 'wp' | 'aufgaben';\n    originalColIndex?: number;\n    label: string;"
          )

          replace_once(
              "    const { fach, category, colIndex, label, date, grade, score, maxScore, percent, note } = editingItem;",
              "    const { fach, category, colIndex, originalCategory, originalColIndex, label, date, grade, score, maxScore, percent, note } = editingItem;"
          )

          replace_once(
              "      category,\n      colIndex,\n      label,",
              "      category,\n      colIndex,\n      originalCategory,\n      originalColIndex,\n      label,"
          )

          replace_once(
              "      category: item.category as any,\n      colIndex: item.colIndex ?? 0,\n      label: item.label,",
              "      category: item.category as any,\n      colIndex: item.colIndex ?? 0,\n      originalCategory: item.category as any,\n      originalColIndex: item.colIndex ?? 0,\n      label: item.label,"
          )

          path.write_text(text)
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-dossier-category-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dossier/DossierLeistungen.tsx .github/workflows/patch-dossier-category-move.yml
          git commit -m "fix: preserve dossier assessment origin when editing"
          git push origin HEAD:fix/dossier-assessment-category-move
