name: Apply Production Default Cleanup

on:
  push:
    branches:
      - fix/remove-production-demo-defaults

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-production-demo-defaults
          fetch-depth: 0

      - name: Remove bundled demo defaults safely
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('src/lib/appState.ts')
          app = app_path.read_text()
          app = replace_once(app,
              "import { DEFAULT_HISTORICAL_STUDENTS } from '../data/historicalStudents';\n",
              "",
              'remove historical demo import')
          app = replace_once(app,
              "  motto: 'Lernen mit Freude ✨',\n",
              "  motto: '',\n",
              'empty default motto')
          app = replace_once(app,
              '''  lehrerProfil: {\n    schulstundenJaehrlich: 120,\n    schularbeitenManuell: 4,\n    testsManuell: 8,\n    ausfluegeManuell: 3,\n    name: "Maximilian Musterlehrer",\n    schule: "Volksschule Musterstadt",\n    motto: "Pädagogik mit Herz ❤️",\n    gegruendetYear: "2018"\n  },\n  unterrichtsmodus_sidebar_open: false,\n  historicalStudents: DEFAULT_HISTORICAL_STUDENTS,''',
              '''  lehrerProfil: {\n    schulstundenJaehrlich: 0,\n    schularbeitenManuell: 0,\n    testsManuell: 0,\n    ausfluegeManuell: 0,\n    name: '',\n    schule: '',\n    motto: '',\n    gegruendetYear: ''\n  },\n  unterrichtsmodus_sidebar_open: false,\n  historicalStudents: [],''',
              'empty initial teacher/archive defaults')
          app = replace_once(app,
              '''  quickLinks: [\n    { id: '1', label: 'YouTube', url: 'https://youtube.com', icon: 'youtube', color: 'rose' },\n    { id: '2', label: 'Kahoot', url: 'https://kahoot.it', icon: 'gamepad', color: 'emerald' },\n    { id: '3', label: 'Gemini', url: 'https://gemini.google.com', icon: 'zap', color: 'indigo' },\n    { id: '4', label: 'Antolin', url: 'https://antolin.westermann.de/', icon: 'link', color: 'sky' },\n    { id: '5', label: 'Anton.app', url: 'https://anton.app/', icon: 'link', color: 'indigo' }\n  ],''',
              "  quickLinks: [],",
              'empty default quick links')
          app = replace_once(app,
              "  tempQrValue: 'https://google.at',\n",
              "  tempQrValue: '',\n",
              'empty default QR value')
          app = replace_once(app,
              '''  parsed.lehrerProfil = parsed.lehrerProfil || {\n    schulstundenJaehrlich: 120,\n    schularbeitenManuell: 4,\n    testsManuell: 8,\n    ausfluegeManuell: 3,\n    name: parsed.anrede && parsed.nachname ? `${parsed.anrede} ${parsed.nachname}` : "Maximilian Musterlehrer",\n    schule: parsed.schulName || "Volksschule Musterstadt",\n    motto: parsed.motto || "Pädagogik mit Herz ❤️",\n    gegruendetYear: "2018"\n  };''',
              '''  const legacyHistoricalStudents = Array.isArray(parsed.historicalStudents) ? parsed.historicalStudents : [];\n  const isLegacyBundledArchive = legacyHistoricalStudents.length === 25\n    && legacyHistoricalStudents[0]?.id === 'h1'\n    && legacyHistoricalStudents[0]?.name === 'Alina Beck'\n    && legacyHistoricalStudents[24]?.id === 'h25'\n    && legacyHistoricalStudents[24]?.name === 'Elena Rhomberg';\n  parsed.historicalStudents = isLegacyBundledArchive ? [] : legacyHistoricalStudents;\n\n  const parsedIdentityName = [parsed.anrede || parsed.vorname, parsed.nachname]\n    .filter(Boolean)\n    .join(' ')\n    .trim();\n  const hasLegacyDemoProfile = parsed.lehrerProfil\n    && parsed.lehrerProfil.name === 'Maximilian Musterlehrer'\n    && parsed.lehrerProfil.schule === 'Volksschule Musterstadt'\n    && parsed.lehrerProfil.motto === 'Pädagogik mit Herz ❤️';\n  if (hasLegacyDemoProfile) parsed.lehrerProfil = undefined;\n\n  parsed.lehrerProfil = parsed.lehrerProfil || {\n    schulstundenJaehrlich: 0,\n    schularbeitenManuell: 0,\n    testsManuell: 0,\n    ausfluegeManuell: 0,\n    name: parsedIdentityName,\n    schule: parsed.schulName || '',\n    motto: parsed.motto || '',\n    gegruendetYear: ''\n  };''',
              'migrate legacy profile/archive defaults')
          app = replace_once(app,
              "    historicalStudents: parsed.historicalStudents || DEFAULT_HISTORICAL_STUDENTS,\n",
              "    historicalStudents: parsed.historicalStudents || [],\n",
              'empty historical fallback')
          app_path.write_text(app)

          profile_path = Path('src/components/LehrerProfilView.tsx')
          profile = profile_path.read_text()
          profile = replace_once(profile,
              "        return Array.isArray(parsed) ? parsed.length : 3;\n",
              "        return Array.isArray(parsed) ? parsed.length : 0;\n",
              'worksheet invalid fallback')
          profile = replace_once(profile,
              "    return 3;\n  }, []);\n\n  const materialsCount",
              "    return 0;\n  }, []);\n\n  const materialsCount",
              'worksheet empty fallback')
          profile = replace_once(profile,
              "  const totalPaperSaved = totalDigitalFiles * (app.schueler?.length || 22);\n  const treesSavedCount = Math.max(1, Math.floor(totalPaperSaved / 150));\n",
              "  const totalPaperSaved = totalDigitalFiles * (app.schueler?.length || 0);\n  const treesSavedCount = Math.floor(totalPaperSaved / 150);\n",
              'eco statistics defaults')
          profile = replace_once(profile,
              '''    return app.lehrerProfil || {\n      schulstundenJaehrlich: 120,\n      schularbeitenManuell: 4,\n      testsManuell: 8,\n      ausfluegeManuell: 3,\n      name: "Maximilian Musterlehrer",\n      schule: "Volksschule Musterstadt",\n      motto: "Pädagogik mit Herz ❤️",\n      gegruendetYear: "2018"\n    };''',
              '''    return app.lehrerProfil || {\n      schulstundenJaehrlich: 0,\n      schularbeitenManuell: 0,\n      testsManuell: 0,\n      ausfluegeManuell: 0,\n      name: '',\n      schule: '',\n      motto: '',\n      gegruendetYear: ''\n    };''',
              'profile fallback')
          profile = replace_once(profile,
              '''    gegruendetYear: profile.gegruendetYear || '2018',\n    schulstundenJaehrlich: profile.schulstundenJaehrlich || 120,\n    schularbeitenManuell: profile.schularbeitenManuell || 4,\n    testsManuell: profile.testsManuell || 8,\n    ausfluegeManuell: profile.ausfluegeManuell || 3''',
              '''    gegruendetYear: profile.gegruendetYear || '',\n    schulstundenJaehrlich: profile.schulstundenJaehrlich ?? 0,\n    schularbeitenManuell: profile.schularbeitenManuell ?? 0,\n    testsManuell: profile.testsManuell ?? 0,\n    ausfluegeManuell: profile.ausfluegeManuell ?? 0''',
              'edit-form initial defaults')
          profile = replace_once(profile,
              '''      gegruendetYear: profile.gegruendetYear || '2018',\n      schulstundenJaehrlich: profile.schulstundenJaehrlich || 120,\n      schularbeitenManuell: profile.schularbeitenManuell || 4,\n      testsManuell: profile.testsManuell || 8,\n      ausfluegeManuell: profile.ausfluegeManuell || 3''',
              '''      gegruendetYear: profile.gegruendetYear || '',\n      schulstundenJaehrlich: profile.schulstundenJaehrlich ?? 0,\n      schularbeitenManuell: profile.schularbeitenManuell ?? 0,\n      testsManuell: profile.testsManuell ?? 0,\n      ausfluegeManuell: profile.ausfluegeManuell ?? 0''',
              'edit-form refresh defaults')
          profile = replace_once(profile,
              '''        const currentProf = prev.lehrerProfil || {\n          schulstundenJaehrlich: 120,\n          schularbeitenManuell: 4,\n          testsManuell: 8,\n          ausfluegeManuell: 3,\n          name: "Maximilian Musterlehrer",\n          schule: "Volksschule Musterstadt",\n          motto: "Pädagogik mit Herz ❤️",\n          gegruendetYear: "2018"\n        };''',
              '''        const currentProf = prev.lehrerProfil || {\n          schulstundenJaehrlich: 0,\n          schularbeitenManuell: 0,\n          testsManuell: 0,\n          ausfluegeManuell: 0,\n          name: '',\n          schule: '',\n          motto: '',\n          gegruendetYear: ''\n        };''',
              'increment fallback')
          profile = replace_once(profile,
              ": (plannedLessonsCount > 0 ? plannedLessonsCount : (profile.schulstundenJaehrlich || 120));",
              ": (plannedLessonsCount > 0 ? plannedLessonsCount : (profile.schulstundenJaehrlich || 0));",
              'hours fallback')
          profile = replace_once(profile,
              "    const schularbeiten = Math.max(saFromGradebook, saFromLessons) || profile.schularbeitenManuell || 4;\n",
              "    const schularbeiten = Math.max(saFromGradebook, saFromLessons) || profile.schularbeitenManuell || 0;\n",
              'assessment fallback')
          profile = replace_once(profile,
              "    const tests = Math.max(lzkFromGradebook, testsFromLessons) || profile.testsManuell || 8;\n",
              "    const tests = Math.max(lzkFromGradebook, testsFromLessons) || profile.testsManuell || 0;\n",
              'test fallback')
          profile = replace_once(profile,
              "    const ausfluege = outingsCount || profile.ausfluegeManuell || 3;\n",
              "    const ausfluege = outingsCount || profile.ausfluegeManuell || 0;\n",
              'outing fallback')
          profile = replace_once(profile,
              '''  const archivedClassesCount = archivedClasses.length; // usually 5\n  \n  // Total career duration\n  const currentYear = new Date().getFullYear();\n  const startYear = parseInt(profile.gegruendetYear || '2018') || 2018;\n  const careerYears = Math.max(1, currentYear - startYear + 1);\n\n  // Lifelong totals with historical calculations (Each archived year has default stats, combined with current dynamic auto/manual calculations)\n  const averageHoursPerArchivedYear = 720; \n  const lifetimeSchulstundenTotal = (archivedClassesCount * averageHoursPerArchivedYear) + Number(finalCurrentStunden);\n  const lifetimeSchularbeitenTotal = (archivedClassesCount * 4) + Number(finalCurrentSchularbeiten);\n  const lifetimeTestsTotal = (archivedClassesCount * 8) + Number(finalCurrentTests);\n  const lifetimeAusfluegeTotal = (archivedClassesCount * 3) + Number(finalCurrentAusfluege);\n\n  // Lifetime homework logs and grades given estimated dynamically\n  const estimatedHomeworkCorrected = lifetimeStudentsTotal * 38; \n  const estimatedGradesGiven = lifetimeStudentsTotal * 3 * 6;''',
              '''  const archivedClassesCount = archivedClasses.length;\n\n  // Career duration is shown only when the teacher entered a real start year.\n  const currentYear = new Date().getFullYear();\n  const configuredStartYear = Number.parseInt(profile.gegruendetYear || '', 10);\n  const careerYears = Number.isFinite(configuredStartYear) && configuredStartYear > 1900 && configuredStartYear <= currentYear\n    ? currentYear - configuredStartYear + 1\n    : 0;\n\n  // Never invent historical workload. Archived student records currently contain\n  // student outcomes, not historical lesson/test/outing totals.\n  const lifetimeSchulstundenTotal = Number(finalCurrentStunden) || 0;\n  const lifetimeSchularbeitenTotal = Number(finalCurrentSchularbeiten) || 0;\n  const lifetimeTestsTotal = Number(finalCurrentTests) || 0;\n  const lifetimeAusfluegeTotal = Number(finalCurrentAusfluege) || 0;\n\n  // These legacy estimate slots stay neutral until backed by recorded data.\n  const estimatedHomeworkCorrected = 0;\n  const estimatedGradesGiven = 0;''',
              'remove invented lifetime estimates')
          profile = profile.replace('{profile.name || "Maximilian Musterlehrer"}', '{profile.name || "Lehrkraft"}')
          profile = profile.replace('{profile.schule || "Grundschule Musterstadt"}', '{profile.schule || "—"}')
          if 'Maximilian Musterlehrer' in profile or 'Volksschule Musterstadt' in profile or 'Pädagogik mit Herz ❤️' in profile:
              raise SystemExit('teacher profile still contains known demo identity strings')
          profile_path.write_text(profile)
          PY

      - name: Commit focused cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/appState.ts src/components/LehrerProfilView.tsx
          git diff --cached --check
          git commit -m "fix(data): remove invented production profile defaults [skip ci]"
          git push origin HEAD:fix/remove-production-demo-defaults
