name: Temporary Dossier Delete Patch

on:
  push:
    branches:
      - fix/dossier-assessment-delete-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dossier-assessment-delete-consistency
          fetch-depth: 0
      - name: Wire immutable delete helper into dossier
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/dossier/DossierLeistungen.tsx')
          text = path.read_text()

          old_import = "import { writeDossierAssessment } from '../../lib/dossierAssessmentWrite';"
          new_import = "import { clearDossierAssessmentForStudent, writeDossierAssessment } from '../../lib/dossierAssessmentWrite';"
          if old_import not in text:
              raise SystemExit('write helper import not found')
          text = text.replace(old_import, new_import, 1)

          old_handler = '''  // Delete Assessment Handler
          const handleDeleteAssessment = (fach: string, category: string, colIndex: number) => {
            setApp(prev => {
              const noten = { ...(prev.noten || {}) };
              if (!noten[student.id]?.[fach]?.[semester]) return prev;

              const prevSubj = (noten[student.id][fach][semester] || {}) as any;
              const subjData: any = {
                sa: [],
                lzk: [],
                wp: [],
                aufgaben: [],
                hue: 0,
                hueAnm: [],
                ...prevSubj
              };
              if (Array.isArray(subjData[category])) {
                const list = [...subjData[category]];
                list[colIndex] = null;
                subjData[category] = list;
                noten[student.id][fach][semester] = subjData;
              }

              return {
                ...prev,
                noten
              };
            });
          };
          '''
          new_handler = '''  // Delete Assessment Handler: clear only this student's value.
          // The assessment column itself (label/date/comment/max points) is shared by the class.
          const handleDeleteAssessment = (fach: string, category: string, colIndex: number) => {
            if (!['sa', 'lzk', 'wp', 'aufgaben'].includes(category)) return;
            setApp(prev => clearDossierAssessmentForStudent(prev, {
              studentId: student.id,
              fach,
              semester,
              category: category as 'sa' | 'lzk' | 'wp' | 'aufgaben',
              colIndex,
            }));
          };
          '''
          if old_handler not in text:
              raise SystemExit('delete handler not found')
          text = text.replace(old_handler, new_handler, 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-dossier-delete-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dossier/DossierLeistungen.tsx .github/workflows/tmp-dossier-delete-patch.yml
          git commit -m "fix: use immutable dossier assessment deletion"
          git push origin HEAD:fix/dossier-assessment-delete-consistency
