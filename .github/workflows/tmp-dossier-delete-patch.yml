name: Temporary Dossier Delete Patch

on:
  push:
    branches:
      - fix/dossier-assessment-delete-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dossier-assessment-delete-consistency
          fetch-depth: 0
      - name: Wire immutable delete helper into dossier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/dossier/DossierLeistungen.tsx')
          text = path.read_text()

          old_import = "import { writeDossierAssessment } from '../../lib/dossierAssessmentWrite';"
          new_import = "import { clearDossierAssessmentForStudent, writeDossierAssessment } from '../../lib/dossierAssessmentWrite';"
          if old_import not in text:
              raise SystemExit('write helper import not found')
          text = text.replace(old_import, new_import, 1)

          pattern = re.compile(
              r"  // Delete Assessment Handler\n"
              r"  const handleDeleteAssessment = \(fach: string, category: string, colIndex: number\) => \{\n"
              r".*?"
              r"\n  \};\n",
              re.S,
          )
          replacement = (
              "  // Delete Assessment Handler: clear only this student's value.\n"
              "  // The assessment column itself (label/date/comment/max points) is shared by the class.\n"
              "  const handleDeleteAssessment = (fach: string, category: string, colIndex: number) => {\n"
              "    if (!['sa', 'lzk', 'wp', 'aufgaben'].includes(category)) return;\n"
              "    setApp(prev => clearDossierAssessmentForStudent(prev, {\n"
              "      studentId: student.id,\n"
              "      fach,\n"
              "      semester,\n"
              "      category: category as 'sa' | 'lzk' | 'wp' | 'aufgaben',\n"
              "      colIndex,\n"
              "    }));\n"
              "  };\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'delete handler matches: {count}')
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-dossier-delete-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dossier/DossierLeistungen.tsx .github/workflows/tmp-dossier-delete-patch.yml
          git commit -m "fix: use immutable dossier assessment deletion"
          git push origin HEAD:fix/dossier-assessment-delete-consistency
