name: KEL Parent Report Real Chrome Print E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/KELParentReport.tsx'
      - 'src/components/PrintCenter.tsx'
      - 'src/lib/studentParticipation.ts'
      - 'src/lib/kelParentReportContract.test.ts'
      - 'src/lib/kelParentReportPrintAudit.test.ts'
      - 'scripts/kel-parent-print-browser-e2e.mjs'
      - '.github/workflows/kel-parent-print-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/KELParentReport.tsx'
      - 'src/components/PrintCenter.tsx'
      - 'src/lib/studentParticipation.ts'
      - 'scripts/kel-parent-print-browser-e2e.mjs'
      - '.github/workflows/kel-parent-print-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kel-parent-print-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Print actual KEL parent report in Chrome
        env:
          NODE_ENV: production
          PORT: 3100
          APP_URL: http://localhost:3100
          SESSION_SECRET: ci-parent-print-session-secret-2026-at-least-32-characters
          LEHRERAPP_ACCESS_TEAM: ci-parent-print-access-2026
          LEHRERAPP_ACCESS_EXTERNAL: ci-parent-print-external-code-2026
          KLASSIO_DATA_DIR: /tmp/klassio-kel-parent-data
          KLASSIO_E2E_BASE_URL: http://localhost:3100/login
          KLASSIO_E2E_ACCESS_CODE: ci-parent-print-access-2026
          KLASSIO_CHROME_DEBUG_URL: http://127.0.0.1:9282
          KLASSIO_E2E_PDF: /tmp/klassio-kel-parent-e2e.pdf
          KLASSIO_E2E_SCREENSHOT: /tmp/klassio-kel-parent-e2e.png
        run: |
          set -euo pipefail
          rm -rf /tmp/klassio-kel-parent-data /tmp/klassio-kel-parent-chrome
          mkdir -p /tmp/klassio-kel-parent-data
          node dist/server.cjs > /tmp/klassio-kel-parent-server.log 2>&1 &
          SERVER_PID=$!
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner."
            exit 1
          fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9282 --remote-allow-origins=* \
            --user-data-dir=/tmp/klassio-kel-parent-chrome about:blank \
            > /tmp/klassio-kel-parent-chrome.log 2>&1 &
          CHROME_PID=$!
          cleanup() {
            kill "$CHROME_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3100/api/health >/tmp/klassio-kel-parent-health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/klassio-kel-parent-health.json
          bun scripts/kel-parent-print-browser-e2e.mjs
      - name: Upload actual print PDF and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassio-kel-parent-print-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/klassio-kel-parent-e2e.pdf
            /tmp/klassio-kel-parent-e2e.png
            /tmp/klassio-kel-parent-server.log
            /tmp/klassio-kel-parent-chrome.log
          if-no-files-found: ignore
          retention-days: 7
