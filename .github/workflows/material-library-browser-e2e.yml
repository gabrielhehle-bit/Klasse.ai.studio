name: Material Library Browser E2E

on:
  pull_request:
    branches:
      - main
      - feature/lesson-drafts-single-planning-workflow
    paths:
      - 'src/components/Materialbibliothek.tsx'
      - 'src/lib/materialCollections.ts'
      - 'src/types.ts'
      - 'scripts/material-library-browser-e2e.mjs'
      - '.github/workflows/material-library-browser-e2e.yml'
  push:
    branches:
      - feature/material-library-teacher-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-library-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production application
        run: bun run build

      - name: Test material library in real headless Chrome
        env:
          NODE_ENV: production
          PORT: 3100
          APP_URL: http://localhost:3100
          SESSION_SECRET: ci-material-e2e-session-secret-longer-than-32-chars-2026
          LEHRERAPP_ACCESS_TEAM: ci-material-access-code-2026
          LEHRERAPP_ACCESS_EXTERNAL: ci-material-external-code-2026
          KLASSIO_DATA_DIR: /tmp/klassio-material-e2e-data
          KLASSIO_E2E_BASE_URL: http://localhost:3100
          KLASSIO_E2E_ACCESS_CODE: ci-material-access-code-2026
          KLASSIO_CHROME_DEBUG_URL: http://127.0.0.1:9242
          KLASSIO_E2E_SCREENSHOT: /tmp/klassio-material-e2e.png
        run: |
          set -euo pipefail
          rm -rf /tmp/klassio-material-e2e-data /tmp/klassio-material-chrome
          mkdir -p /tmp/klassio-material-e2e-data

          node dist/server.cjs > /tmp/klassio-material-server.log 2>&1 &
          SERVER_PID=$!

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium is unavailable on this runner."
            exit 1
          fi

          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9242 --remote-allow-origins=* \
            --user-data-dir=/tmp/klassio-material-chrome about:blank \
            > /tmp/klassio-material-chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if curl --fail --silent http://localhost:3100/api/health >/tmp/klassio-material-health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/klassio-material-health.json
          bun scripts/material-library-browser-e2e.mjs

      - name: Upload screenshots and server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-library-browser-${{ github.sha }}
          path: |
            /tmp/klassio-material-e2e.png
            /tmp/klassio-material-server.log
            /tmp/klassio-material-chrome.log
          if-no-files-found: ignore
          retention-days: 7
