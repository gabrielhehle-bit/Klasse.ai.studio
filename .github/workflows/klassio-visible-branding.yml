name: Apply Klassio Visible Branding

on:
  push:
    branches:
      - fix/klassio-visible-branding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/klassio-visible-branding
          fetch-depth: 0
      - name: Patch visible product naming safely
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
            'src/lib/planerExcelService.ts': [
              ("Bitte verwende die LehrerAPP-Vorlage.", "Bitte verwende die Klassio-Vorlage.", 3),
            ],
            'src/lib/backupRestore.ts': [
              ("Diese Datei enthält keinen gültigen LehrerAPP-Datenbestand.", "Diese Datei enthält keinen gültigen Klassio-Datenbestand.", 1),
            ],
            'src/lib/backupCryptoService.ts': [
              ("Die Datei ist kein gültiges, verschlüsseltes LehrerAPP-Backup.", "Die Datei ist kein gültiges, verschlüsseltes Klassio-Backup.", 1),
            ],
            'src/components/PrintHeader.tsx': [
              ("'SchoolBase Pro'", "'Klassio'", 1),
            ],
            'src/components/gradebook/AssessmentItemModal.tsx': [
              ("Die LehrerAPP ermittelt automatisch", "Klassio ermittelt automatisch", 1),
            ],
            'src/components/ui/DesignSystemPreview.tsx': [
              ("LehrerAPP Designsystem", "Klassio Designsystem", 2),
            ],
            'src/components/settings/SettingsHeader.tsx': [
              ("Was möchtest du an deiner LehrerAPP anpassen?", "Was möchtest du in Klassio anpassen?", 1),
            ],
            'src/components/settings/GeneralSettings.tsx': [
              ("Starte die interaktive Erklärung der LehrerAPP erneut", "Starte die interaktive Erklärung von Klassio erneut", 1),
            ],
            'src/components/settings/BackupSettings.tsx': [
              ("LehrerAPP auf dem Gerät installieren (PWA)", "Klassio auf dem Gerät installieren (PWA)", 1),
              ("✓ Die LehrerAPP ist bereits als eigenständige App auf diesem Gerät installiert.", "✓ Klassio ist bereits als eigenständige App auf diesem Gerät installiert.", 1),
            ],
            'src/components/Topbar.tsx': [
              ("LehrerAPP freiwillig unterstützen", "Klassio freiwillig unterstützen", 3),
              ("LehrerAPP unterstützen (PayPal)", "Klassio unterstützen (PayPal)", 1),
            ],
            'src/components/Backup.tsx': [
              ("LehrerAPP-Sicherungsdatei auswählen (.json / .lehrerapp)", "Klassio-Sicherungsdatei auswählen (.json / .lehrerapp)", 1),
            ],
          }

          changed = []
          for filename, rules in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new, expected in rules:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{filename}: {old!r} expected {expected}, found {count}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(filename)

          print('Changed files:')
          print('\n'.join(changed))
          PY
      - name: Commit focused branding patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "fix(branding): use Klassio in visible product copy [skip ci]"
          git push origin HEAD:fix/klassio-visible-branding
