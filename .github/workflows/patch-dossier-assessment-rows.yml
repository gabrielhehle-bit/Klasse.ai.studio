name: Temporary Dossier Assessment Rows Patch

on:
  push:
    branches:
      - feature/dossier-assessment-rows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted patch
        run: node .github/scripts/patch-dossier-assessment-rows.mjs
      - name: Commit patched component and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dossier/DossierLeistungen.tsx
          git rm .github/scripts/patch-dossier-assessment-rows.mjs .github/workflows/patch-dossier-assessment-rows.yml
          git commit -m "feat: compact dossier assessment rows"
          git push origin HEAD:${GITHUB_REF_NAME}
