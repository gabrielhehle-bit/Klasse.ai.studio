name: Pre-Deployment Audit

on:
  push:
    branches:
      - fix/pre-deployment-blockers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
          test -f dist/manifest.webmanifest
          echo "Build output present."
