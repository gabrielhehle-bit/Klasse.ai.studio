name: Temporary Dossier Visual Polish

on:
  push:
    branches:
      - feature/dossier-visual-cockpit
    paths:
      - '.github/workflows/temp-dossier-visual-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dossier-visual-cockpit
          fetch-depth: 0
      - name: Polish visual metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/components/dossier/DossierUebersicht.tsx')
          text=path.read_text()
          old="    const normalizedCurrent=avg===null?null:mode==='grades'?Math.max(0,Math.min(100,((5-avg)/4)*100)):Math.max(0,Math.min(100,avg));\n    const assessments:{score:number;date:string;order:number}[]=[];\n    let order=0;"
          new="    const currentNumeric=hasFinal?Number(String(final).replace(',','.')):avg;\n    const normalizedCurrent=currentNumeric===null||!Number.isFinite(Number(currentNumeric))?null:mode==='grades'?Math.max(0,Math.min(100,((5-Number(currentNumeric))/4)*100)):Math.max(0,Math.min(100,Number(currentNumeric)));\n    const assessments:{score:number;date:string;order:number}[]=[];\n    let assessmentCount=0;\n    let order=0;"
          if old not in text: raise SystemExit('normalization anchor missing')
          text=text.replace(old,new)
          old2="        if(raw===null||raw===undefined||raw===''||['e','f','x','-'].includes(String(raw).toLowerCase())){order++;return;}\n        const primitive="
          new2="        if(raw===null||raw===undefined||raw===''||['e','f','x','-'].includes(String(raw).toLowerCase())){order++;return;}\n        assessmentCount++;\n        const primitive="
          if old2 not in text: raise SystemExit('assessment count anchor missing')
          text=text.replace(old2,new2)
          text=text.replace('trendLabel,assessmentCount:assessments.length,participation:', 'trendLabel,assessmentCount,participation:')
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-dossier-visual-polish.yml
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/dossier/DossierUebersicht.tsx .github/workflows/temp-dossier-visual-polish.yml
          git commit -m 'fix: polish dossier visual metrics'
          git push origin HEAD:feature/dossier-visual-cockpit
