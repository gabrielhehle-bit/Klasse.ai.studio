name: Email Account Two-Device Browser E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-sync-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Run same-email home and school planning in two real Chrome profiles
        env:
          NODE_ENV: production
          PORT: 3100
          APP_URL: http://localhost:3100
          SESSION_SECRET: ci-school-verification-session-secret-2026-at-least-32-characters
          LEHRERAPP_ACCESS_TEAM: ci-school-verification-team-gate-4x9k-2026
          LEHRERAPP_ACCESS_EXTERNAL: ci-school-verification-external-gate-7m2q-2026
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 2525
          SMTP_SECURE: "false"
          SMTP_FROM: klassio-e2e@klassio.local
          KLASSIO_SCHOOL_ADMIN_EMAILS: admin.e2e@klassio.local
          KLASSIO_DATA_DIR: /tmp/klassio-school-e2e-data
          KLASSIO_E2E_BASE_URL: http://localhost:3100
          KLASSIO_E2E_SMTP_PORT: 2525
          KLASSIO_E2E_SMTP_CODES: /tmp/klassio-school-mail.json
          KLASSIO_CHROME_DEBUG_TEACHER: http://127.0.0.1:9232
          KLASSIO_CHROME_DEBUG_ADMIN: http://127.0.0.1:9233
          KLASSIO_E2E_TEACHER_EMAIL: lehrkraft.e2e@vs-neu.wien
          KLASSIO_E2E_ADMIN_EMAIL: admin.e2e@klassio.local
          KLASSIO_E2E_TEACHER_VAULT: Klassio-E2E-Lehrkraft-2026!
          KLASSIO_E2E_ADMIN_VAULT: Klassio-E2E-Admin-2026!
          KLASSIO_E2E_SCREENSHOT_TEACHER: /tmp/klassio-school-teacher.png
          KLASSIO_E2E_SCREENSHOT_COCKPIT: /tmp/klassio-school-cockpit.png
          KLASSIO_E2E_SCREENSHOT_ADMIN: /tmp/klassio-school-admin.png
        run: |
          set -euo pipefail

          rm -rf /tmp/klassio-school-e2e-data /tmp/klassio-school-chrome-teacher /tmp/klassio-school-chrome-admin
          rm -f /tmp/klassio-school-health.json /tmp/klassio-school-mail.json
          mkdir -p /tmp/klassio-school-e2e-data

          node scripts/e2e-smtp-capture.mjs > /tmp/klassio-school-smtp.log 2>&1 &
          SMTP_PID=$!

          node dist/server.cjs > /tmp/klassio-school-server.log 2>&1 &
          SERVER_PID=$!

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner."
            exit 1
          fi

          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --remote-debugging-port=9232 --remote-allow-origins=*             --user-data-dir=/tmp/klassio-school-chrome-teacher about:blank             > /tmp/klassio-school-chrome-teacher.log 2>&1 &
          CHROME_TEACHER_PID=$!

          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --remote-debugging-port=9233 --remote-allow-origins=*             --user-data-dir=/tmp/klassio-school-chrome-admin about:blank             > /tmp/klassio-school-chrome-admin.log 2>&1 &
          CHROME_ADMIN_PID=$!

          cleanup() {
            kill "$CHROME_TEACHER_PID" 2>/dev/null || true
            kill "$CHROME_ADMIN_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            kill "$SMTP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..60}; do
            if curl --fail --silent http://localhost:3100/api/health >/tmp/klassio-school-health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/klassio-school-health.json

          for i in {1..40}; do
            if grep -q 'SMTP listening' /tmp/klassio-school-smtp.log 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          grep -q 'SMTP listening' /tmp/klassio-school-smtp.log

          bun scripts/account-sync-browser-e2e.mjs

      - name: Upload email sync browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassio-account-sync-two-browser-${{ github.sha }}
          path: |
            /tmp/klassio-school-teacher.png
            /tmp/klassio-school-cockpit.png
            /tmp/klassio-school-admin.png
            /tmp/klassio-school-server.log
            /tmp/klassio-school-smtp.log
            /tmp/klassio-school-chrome-teacher.log
            /tmp/klassio-school-chrome-admin.log
            /tmp/klassio-school-mail.json
            /tmp/klassio-school-e2e-data/school-registry.json
          if-no-files-found: ignore
          retention-days: 7
