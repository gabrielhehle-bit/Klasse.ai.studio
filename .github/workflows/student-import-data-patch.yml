name: Apply Student Import Data Patch

on:
  push:
    branches:
      - fix/student-import-data-consistency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-import-data-consistency
          fetch-depth: 0
      - name: Patch import paths safely
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch_file(path_str, replacements):
              path = Path(path_str)
              text = path.read_text()
              for old, new, label in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_str} / {label}: expected exactly one match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch_file('src/components/KlassenlistenImport.tsx', [
              (
                  "import { SokratesImportModal } from './SokratesImportModal';\n",
                  "import { SokratesImportModal } from './SokratesImportModal';\nimport { normalizeStudentGender } from '../lib/studentListData';\n",
                  'gender helper import'
              ),
              (
                  "      geschlecht: s.geschlecht || 'w',\n",
                  "      geschlecht: normalizeStudentGender(s.geschlecht),\n",
                  'canonical imported gender'
              ),
          ])

          patch_file('src/lib/klassenlistenImport.ts', [
              (
                  "export interface ParsedStudent {\n",
                  "import { toDateInputValue } from './studentListData';\n\nexport interface ParsedStudent {\n",
                  'date helper import'
              ),
              (
                  '''function normalizeDate(str: string): string {\n  if (!str) return '';\n  const clean = str.trim();\n  \n  // Format: YYYY-MM-DD\n  if (/^\\d{4}-\\d{2}-\\d{2}$/.test(clean)) {\n    return clean;\n  }\n  \n  // Format: DD.MM.YYYY or DD.MM.YY\n  const dotParts = clean.split('.');\n  if (dotParts.length === 3) {\n    const day = dotParts[0].padStart(2, '0');\n    const month = dotParts[1].padStart(2, '0');\n    let year = dotParts[2].trim();\n    if (year.length === 2) {\n      year = '20' + year; // assume 21st century\n    }\n    if (year.length === 4) {\n      return `${year}-${month}-${day}`;\n    }\n  }\n  return clean;\n}''',
                  '''function normalizeDate(str: string): string {\n  return toDateInputValue(str);\n}''',
                  'validated date normalization'
              ),
              (
                  "    let geschlecht = 'w';\n",
                  "    let geschlecht = '';\n",
                  'unknown gender stays unknown'
              ),
          ])

          patch_file('src/lib/sokratesParser.ts', [
              (
                  "import { Student } from '../types';\n",
                  "import { Student } from '../types';\nimport { normalizeStudentGender } from './studentListData';\n",
                  'gender helper import'
              ),
              (
                  "    let geschlecht = 'w';\n",
                  "    let geschlecht = '';\n",
                  'initial unknown gender'
              ),
              (
                  "      geschlecht = 'w'; // default\n",
                  "      geschlecht = ''; // unknown: do not infer gender without source data\n",
                  'no female fallback'
              ),
              (
                  "      geschlecht: s.geschlecht || 'w',\n",
                  "      geschlecht: normalizeStudentGender(s.geschlecht),\n",
                  'canonical app gender'
              ),
          ])

          patch_file('src/components/StudentList.tsx', [
              (
                  "                        <option value=\"männlich\">männlich</option>\n",
                  "                        <option value=\"männlich\">männlich</option>\n                        <option value=\"divers\">divers</option>\n",
                  'divers option'
              ),
              (
                  "Klassenliste • Gedruckt mit SchoolBase Pro",
                  "Klassenliste • Gedruckt mit Klassio",
                  'current product name'
              ),
          ])
          PY
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/KlassenlistenImport.tsx src/lib/klassenlistenImport.ts src/lib/sokratesParser.ts src/components/StudentList.tsx
          git diff --cached --check
          git commit -m "fix(students): normalize imported identity data [skip ci]"
          git push origin HEAD:fix/student-import-data-consistency
