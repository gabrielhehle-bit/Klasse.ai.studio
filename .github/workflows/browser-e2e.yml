name: Browser E2E

on:
  push:
    branches:
      - 'chore/browser-e2e-validation'
      - 'reconcile/klassio-source-of-truth'
  pull_request:
    branches:
      - reconcile/klassio-source-of-truth
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Run Klassio in production mode and drive real Chrome
        env:
          NODE_ENV: production
          PORT: 3100
          APP_URL: http://localhost:3100
          SESSION_SECRET: ci-browser-session-secret-2026-at-least-32-characters
          LEHRERAPP_ACCESS_TEAM: ci-team-access-code-2026
          LEHRERAPP_ACCESS_EXTERNAL: ci-external-access-code-2026
          KLASSIO_E2E_BASE_URL: http://localhost:3100
          KLASSIO_E2E_ACCESS_CODE: ci-team-access-code-2026
          KLASSIO_E2E_VAULT_PASSWORD: Klassio-CI-Tresor-2026!
          KLASSIO_E2E_SCREENSHOT: /tmp/klassio-browser-e2e.png
        run: |
          set -euo pipefail

          node dist/server.cjs > /tmp/klassio-browser-server.log 2>&1 &
          SERVER_PID=$!

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner."
            exit 1
          fi

          "$CHROME_BIN"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --remote-debugging-port=9222             --remote-allow-origins=*             --user-data-dir=/tmp/klassio-chrome-profile             about:blank > /tmp/klassio-chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..40}; do
            if curl --fail --silent http://localhost:3100/api/health >/tmp/klassio-browser-health.json; then
              break
            fi
            sleep 0.5
          done

          grep -q '"status":"ok"' /tmp/klassio-browser-health.json
          bun scripts/browser-e2e.mjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassio-browser-e2e-${{ github.sha }}
          path: |
            /tmp/klassio-browser-e2e.png
            /tmp/klassio-browser-server.log
            /tmp/klassio-chrome.log
          if-no-files-found: ignore
          retention-days: 7
