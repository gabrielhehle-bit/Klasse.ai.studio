name: SheetJS Patched Lockfile Refresh (Isolated Branch)

# Temporary, branch-scoped dependency resolution; does not expose production secrets.
on:
  push:
    branches:
      - security/sheetjs-0203-20261116
    paths:
      - package.json
      - src/lib/sheetJsExportSafety.test.ts
      - .github/workflows/refresh-sheetjs-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'gabrielhehle-bit/Klasse.ai.studio'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve official patched SheetJS tarball
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.dependencies.xlsx!=='https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz') process.exit(1)"
          bun install
          node -e "if(require('xlsx').version!=='0.20.3') process.exit(1)"
      - name: TypeScript
        run: bun run lint
      - name: Tests (including real XLSX ZIP export)
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Commit only regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add -- bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(lock): pin official patched SheetJS 0.20.3 tarball"
          git push origin HEAD:refs/heads/security/sheetjs-0203-20261116
