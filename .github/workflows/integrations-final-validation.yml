name: Integrations Final Validation

on:
  push:
    branches:
      - fix/integrations-final
  pull_request:
    branches:
      - reconcile/klassio-source-of-truth

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
