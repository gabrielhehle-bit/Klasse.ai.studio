name: Refresh Bun lockfile

on:
  push:
    branches:
      - fix/reconciliation-finalization
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/reconciliation-finalization

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh lockfile
        run: bun install

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: refresh Bun lockfile"
          git push origin HEAD:fix/reconciliation-finalization
